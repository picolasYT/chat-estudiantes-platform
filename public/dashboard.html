<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Estudiantes - Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 300px;
      background: white;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .user-header {
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-align: center;
    }

    .user-header h2 {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .user-header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .users-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .user-item {
      padding: 15px;
      background: #f9f9f9;
      border-radius: 5px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.3s;
      border-left: 3px solid transparent;
    }

    .user-item:hover {
      background: #f0f0f0;
      border-left-color: #667eea;
    }

    .user-item.active {
      background: #e8f0ff;
      border-left-color: #667eea;
    }

    .user-item-name {
      font-weight: 600;
      color: #333;
      margin-bottom: 3px;
    }

    .user-item-status {
      font-size: 12px;
      color: #999;
    }

    .sidebar-footer {
      padding: 10px;
      border-top: 1px solid #ddd;
      display: flex;
      gap: 5px;
    }

    .btn-small {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.3s;
    }

    .btn-admin {
      background: #667eea;
      color: white;
    }

    .btn-logout {
      background: #ff6b6b;
      color: white;
    }

    .btn-small:hover {
      opacity: 0.9;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 20px;
      background: white;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header h3 {
      color: #333;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      display: flex;
      margin-bottom: 10px;
    }

    .message.sent {
      justify-content: flex-end;
    }

    .message.received {
      justify-content: flex-start;
    }

    .message-content {
      max-width: 60%;
      padding: 10px 15px;
      border-radius: 10px;
      word-wrap: break-word;
    }

    .message.sent .message-content {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .message.received .message-content {
      background: #e9ecef;
      color: #333;
    }

    .message-time {
      font-size: 11px;
      color: #999;
      margin-top: 3px;
    }

    .chat-input-area {
      padding: 20px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      gap: 10px;
    }

    .chat-input-area input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
    }

    .chat-input-area button {
      padding: 10px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      color: #999;
      text-align: center;
    }

    .empty-state h3 {
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="user-header">
      <h2 id="currentUser">Usuario</h2>
      <p>En línea</p>
    </div>
    <div class="users-list" id="usersList"></div>
    <div class="sidebar-footer">
      <button class="btn-small btn-admin" onclick="goToAdmin()">🔐 Admin</button>
      <button class="btn-small btn-logout" onclick="logout()">Salir</button>
    </div>
  </div>

  <div class="main-content">
    <div class="chat-header">
      <h3 id="chatTitle">Selecciona un usuario para chatear</h3>
      <button id="reportBtn" style="display: none; padding: 8px 15px; background: #ff9800; color: white; border: none; border-radius: 5px; cursor: pointer;" onclick="reportUser()">📢 Reportar</button>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="empty-state">
        <h3>👋 Bienvenido a Chat Estudiantes</h3>
        <p>Selecciona un usuario de la lista para empezar a chatear</p>
      </div>
    </div>
    <div class="chat-input-area" id="chatInputArea" style="display: none;">
      <input type="text" id="messageInput" placeholder="Escribe tu mensaje..." autocomplete="off">
      <button onclick="sendMessage()">Enviar</button>
    </div>
  </div>

  <script>
    let currentUser = null;
    let selectedUser = null;
    let messages = [];

    // Check auth
    async function checkAuth() {
      const response = await fetch('/api/auth/me');
      if (!response.ok) {
        window.location.href = '/';
        return;
      }
      const data = await response.json();
      currentUser = data.user;
      document.getElementById('currentUser').textContent = currentUser.username;
      loadUsers();
    }

    // Load users
    async function loadUsers() {
      try {
        const response = await fetch('/api/chat/users');
        const data = await response.json();
        const usersList = document.getElementById('usersList');
        usersList.innerHTML = '';

        data.data.forEach(user => {
          const userItem = document.createElement('div');
          userItem.className = 'user-item';
          userItem.innerHTML = `
            <div class="user-item-name">${user.username}</div>
            <div class="user-item-status">Disponible</div>
          `;
          userItem.addEventListener('click', () => selectUser(user));
          usersList.appendChild(userItem);
        });
      } catch (error) {
        console.error('Error loading users:', error);
      }
    }

    // Select user
    function selectUser(user) {
      selectedUser = user;
      document.querySelectorAll('.user-item').forEach(item => item.classList.remove('active'));
      event.target.closest('.user-item').classList.add('active');
      document.getElementById('chatTitle').textContent = `Chatear con ${user.username}`;
      document.getElementById('reportBtn').style.display = 'block';
      document.getElementById('chatInputArea').style.display = 'flex';
      document.getElementById('chatMessages').innerHTML = '';
      loadMessages();
      document.getElementById('messageInput').focus();
    }

    // Load messages
    async function loadMessages() {
      try {
        const response = await fetch('/api/chat/messages');
        const data = await response.json();
        messages = data.data.filter(m => 
          (m.senderId === currentUser.id && m.receiverId === selectedUser.id) ||
          (m.senderId === selectedUser.id && m.receiverId === currentUser.id)
        );
        displayMessages();
      } catch (error) {
        console.error('Error loading messages:', error);
      }
    }

    // Display messages
    function displayMessages() {
      const chatMessages = document.getElementById('chatMessages');
      chatMessages.innerHTML = '';
      
      if (messages.length === 0) {
        chatMessages.innerHTML = '<div class="empty-state"><p>Sin mensajes aún. ¡Inicia la conversación!</p></div>';
        return;
      }

      messages.forEach(msg => {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${msg.senderId === currentUser.id ? 'sent' : 'received'}`;
        const time = new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        msgDiv.innerHTML = `
          <div style="display: flex; flex-direction: column; align-items: ${msg.senderId === currentUser.id ? 'flex-end' : 'flex-start'};">
            <div class="message-content">${msg.content}</div>
            <div class="message-time">${time}</div>
          </div>
        `;
        chatMessages.appendChild(msgDiv);
      });
      
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Send message
    async function sendMessage() {
      const content = document.getElementById('messageInput').value.trim();
      if (!content || !selectedUser) return;

      try {
        const response = await fetch('/api/chat/messages/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            receiverId: selectedUser.id,
            content
          })
        });

        if (response.ok) {
          document.getElementById('messageInput').value = '';
          loadMessages();
        }
      } catch (error) {
        console.error('Error sending message:', error);
      }
    }

    // Report user
    async function reportUser() {
      if (!selectedUser) return;

      const reason = prompt('¿Por qué reportas a este usuario?');
      if (!reason) return;

      try {
        const response = await fetch('/api/chat/reports', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            reportedUserId: selectedUser.id,
            reportType: 'other',
            reason
          })
        });

        const data = await response.json();
        if (data.success) {
          alert('✅ ' + data.message);
        }
      } catch (error) {
        console.error('Error reporting user:', error);
      }
    }

    // Go to admin
    function goToAdmin() {
      if (currentUser && currentUser.isAdmin) {
        window.location.href = '/admin';
      } else {
        alert('Solo administradores pueden acceder al panel de admin');
      }
    }

    // Logout
    async function logout() {
      if (confirm('¿Seguro que quieres cerrar sesión?')) {
        await fetch('/api/auth/logout', { method: 'POST' });
        window.location.href = '/';
      }
    }

    // Enter key to send message
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && selectedUser) {
        sendMessage();
      }
    });

    // Auto-load messages every 3 seconds
    setInterval(() => {
      if (selectedUser) {
        loadMessages();
      }
    }, 3000);

    // Initialize
    checkAuth();
  </script>
</body>
</html>
